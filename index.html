<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>albun traker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="styles.css" rel="stylesheet">
</head>

<body>

    <h1 class="p-3">Album Tracker</h1>

    <div class="container-fluid form-div">
        <div class="row">
            <div class="col-12 col-md-4 col-lg-3 text-start">
                <form id="album-form">
                    <div class="form-floating mb-2 text-dark">
                        <input type="text" name="title" class="form-control" id="titleInput" placeholder="Título">
                        <label for="titleInput">Título</label>
                    </div>

                    <div class="form-floating mb-2 text-dark">
                        <input type="text" name="artis" class="form-control" id="artistInput" placeholder="Artista">
                        <label for="artistInput">Artista</label>
                    </div>

                    <div class="form-floating mb-2 text-dark">
                        <input type="number" name="year" class="form-control" id="yearInput"
                            placeholder="Año de salida">
                        <label for="yearInput">Año de salida</label>
                    </div>

                    <div class="form-floating mb-2 text-dark">
                        <input type="text" name="genre" class="form-control" id="genreInput" placeholder="Género">
                        <label for="genreInput">Género</label>
                    </div>

                    <div class="form-floating mb-2 text-dark">
                        <input type="number" name="rating" class="form-control" id="ratingInput" placeholder="Rating"
                            min="1" max="5">
                        <label for="ratingInput">Rating</label>
                    </div>

                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" name="listened" role="switch"
                            id="listenedCheck">
                        <label class="form-check-label text-dark" for="listenedCheck">
                            Escuchado
                        </label>
                    </div>

                    <button type="submit" class="btn btn-outline-primary w-100">Enviar</button>
                </form>
            </div>

            <div class="col-12 col-md-8 col-lg-9 text-dark">
                <main id="albun-container">
                    <!-- Texto del elemento contenedor
                    <p> Hola dentro de un P</p> -->
                </main>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="app.js"></script>
</body>

</html>
