<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>albun traker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<body>

    <h1 class="p-3">Album Tracker</h1>

    <div class="container-fluid">
        <div class="row">
            <div class="col-12 col-md-4 col-lg-3 text-start">
                <form>
                    <div class="form-floating mb-2 text-dark">
                        <input type="text" class="form-control" id="titleInput" placeholder="Título">
                        <label for="titleInput">Título</label>
                    </div>

                    <div class="form-floating mb-2 text-dark">
                        <input type="text" class="form-control" id="artistInput" placeholder="Artista">
                        <label for="artistInput">Artista</label>
                    </div>

                    <div class="form-floating mb-2 text-dark">
                        <input type="number" class="form-control" id="yearInput" placeholder="Año de salida">
                        <label for="yearInput">Año de salida</label>
                    </div>

                    <div class="form-floating mb-2 text-dark">
                        <input type="text" class="form-control" id="genreInput" placeholder="Género">
                        <label for="genreInput">Género</label>
                    </div>

                    <div class="form-floating mb-2 text-dark">
                        <input type="number" class="form-control" id="ratingInput" placeholder="Rating" min="1" max="5">
                        <label for="ratingInput">Rating</label>
                    </div>

                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" role="switch" id="listenedCheck">
                        <label class="form-check-label text-light" for="listenedCheck">
                            Escuchado
                        </label>
                    </div>

                    <button type="submit" class="btn btn-outline-primary w-100">Enviar</button>
                </form>
            </div>

            <div class="col-12 col-md-8 col-lg-9 text-light">
                Cards de album
            </div>
        </div>
    </div>

    <h1>Albun Traker</h1>  Mio

    <div class="container text-center bg-black">
        <div class="row">
            <div class="col-3 justify-content-start">
                <div class="form-floating mb-2">
                    <input type="text" class="form-control" id="floatingInput" placeholder="name@example.com">
                    <label for="floatingInput">Titulo</label>
                </div>

                <div class="form-floating mb-2">
                    <input type="text" class="form-control" id="floatingInput" placeholder="text">
                    <label for="floatingInput">Artista</label>
                </div>

                <div class="form-floating mb-2">
                    <input type="text" class="form-control" id="floatingInput" placeholder="text">
                    <label for="floatingInput">Año de salida</label>
                </div>

                <div class="form-floating mb-2">
                    <input type="text" class="form-control" id="floatingInput" placeholder="text">
                    <label for="floatingInput">Genero</label>
                </div>

                <div class="form-floating mb-2">
                    <input type="text" class="form-control" id="floatingInput" placeholder="text">
                    <label for="floatingInput">Raiting</label>
                </div>

                <div class="form-floating mb-2">
                    <input type="text" class="form-control" id="floatingInput" placeholder="text">
                    <label for="floatingInput">Listened</label>
                </div>

                <button type="button" class="btn btn-outline-primary">Enviar</button>
            </div>
            <div class="col">
               Cards de albun
            </div>
            
        </div>
    </div>
